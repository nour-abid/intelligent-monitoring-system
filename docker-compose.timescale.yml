services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: mq-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: mq_monitoring
      POSTGRES_USER: mq_user
      POSTGRES_PASSWORD: mq_password
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

volumes:
  timescale_data: