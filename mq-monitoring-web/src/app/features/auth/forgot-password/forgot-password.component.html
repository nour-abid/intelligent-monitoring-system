<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <span class="auth-card__logo">MQ</span>
      <h1 class="auth-card__title">Reset Password</h1>
    </div>

    <p class="auth-card__hint">Enter your account email. We'll send you a 6-digit code.</p>

    <form class="auth-card__form" (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
      @if (error()) {
        <p class="auth-card__error" role="alert">{{ error() }}</p>
      }

      <div class="auth-card__field">
        <label class="auth-card__label" for="email">Email</label>
        <input
          class="auth-card__input"
          id="email"
          type="email"
          name="email"
          autocomplete="email"
          required
          [(ngModel)]="email"
          [disabled]="loading()"
        />
      </div>

      <button
        class="auth-card__submit"
        type="submit"
        [disabled]="loading() || !f.valid"
      >
        @if (loading()) {
          <span class="spinner spinner--sm"></span>
        } @else {
          Send Code
        }
      </button>
    </form>

    <p class="auth-card__footer">
      <a routerLink="/login">Back to Sign In</a>
    </p>
  </div>
</div>
