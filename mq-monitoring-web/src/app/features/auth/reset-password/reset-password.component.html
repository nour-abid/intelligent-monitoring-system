<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <span class="auth-card__logo">MQ</span>
      <h1 class="auth-card__title">New Password</h1>
    </div>

    <p class="auth-card__hint">Choose a new password. Must be at least 8 characters.</p>

    <form class="auth-card__form" (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
      @if (error()) {
        <p class="auth-card__error" role="alert">{{ error() }}</p>
      }

      <div class="auth-card__field">
        <label class="auth-card__label" for="password">New Password</label>
        <input
          class="auth-card__input"
          id="password"
          type="password"
          name="password"
          autocomplete="new-password"
          required
          minlength="8"
          [(ngModel)]="password"
          [disabled]="loading()"
        />
      </div>

      <div class="auth-card__field">
        <label class="auth-card__label" for="passwordConfirmation">Confirm Password</label>
        <input
          class="auth-card__input"
          id="passwordConfirmation"
          type="password"
          name="passwordConfirmation"
          autocomplete="new-password"
          required
          minlength="8"
          [(ngModel)]="passwordConfirmation"
          [disabled]="loading()"
        />
      </div>

      <button
        class="auth-card__submit"
        type="submit"
        [disabled]="loading() || !f.valid"
      >
        @if (loading()) {
          <span class="spinner spinner--sm"></span>
        } @else {
          Set New Password
        }
      </button>
    </form>

    <p class="auth-card__footer">
      <a routerLink="/login">Back to Sign In</a>
    </p>
  </div>
</div>
