<!-- Personal Time Series Template -->
<div class="timeseries-chart">
  <!-- Placeholder for Chart.js/ng-simple-charts implementation -->
  <div class="chart-placeholder">
    <svg viewBox="0 0 600 300" class="line-chart">
      <!-- Simple line chart visualization -->
      <polyline points="50,250 130,180 210,200 290,150 370,140 450,100" 
                 fill="none" stroke="#8b5cf6" stroke-width="3" vector-effect="non-scaling-stroke"/>
      
      <!-- Grid lines -->
      <line x1="50" y1="250" x2="450" y2="250" stroke="#e5e7eb" stroke-width="1"/>
      <line x1="50" y1="200" x2="450" y2="200" stroke="#f3f4f6" stroke-width="1"/>
      <line x1="50" y1="150" x2="450" y2="150" stroke="#f3f4f6" stroke-width="1"/>
      <line x1="50" y1="100" x2="450" y2="100" stroke="#f3f4f6" stroke-width="1"/>
      
      <!-- Axes -->
      <line x1="50" y1="50" x2="50" y2="250" stroke="#d1d5db" stroke-width="2"/>
      <line x1="50" y1="250" x2="500" y2="250" stroke="#d1d5db" stroke-width="2"/>
    </svg>
  </div>
  
  <div class="chart-legend">
    <p class="metric-label">{{ selectedMetric | titlecase | replace:'_':' ' }}</p>
    <p class="metric-description">
      @switch (selectedMetric) {
        @case ('working_time') { Your daily working time (hours) }
        @case ('phone_usage') { Daily phone usage (minutes) }
        @case ('inactivity') { Daily inactivity events (count) }
        @case ('focus_score') { Daily focus score (%) }
      }
    </p>
  </div>
</div>
